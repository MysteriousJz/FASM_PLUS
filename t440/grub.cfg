# =============================================================================
# FASM_PLUS T440 — GRUB2 configuration
# Boots the Multiboot2 kernel with a VESA linear-framebuffer graphics mode.
#
# The kernel is a Multiboot2 ELF image. GRUB2's `multiboot2` command loads it
# and, because the kernel's Multiboot2 header carries a framebuffer request
# tag, GRUB2 sets a graphics mode and passes the framebuffer address to the
# kernel in the boot-information structure.
#
# No menus, no timeout — boot straight into the kernel.
# =============================================================================

# --- Graphics mode -----------------------------------------------------------
# Request a 32-bit linear framebuffer. The kernel asks for 1024x768x32, a safe
# VESA mode. The ThinkPad T440 panel is natively 1600x900; both are supported
# by the Intel HD Graphics 4400 VESA BIOS.
#
#   Safe choices for the T440 (in order of preference):
#     1024x768x32   — universally supported, good for a first boot
#     1366x768x32   — widescreen, supported by the HD 4400
#     1600x900x32   — the T440's native panel resolution
#
# If the screen stays black, drop to 1024x768x32 (edit the two lines below).
set gfxmode=1024x768x32
set gfxpayload=1024x768x32

# Load the video drivers and keep the graphics mode through the boot handoff.
insmod all_video
insmod gfxterm
insmod vbe
terminal_output gfxterm

# --- Boot the kernel immediately --------------------------------------------
set timeout=0
set default=0

menuentry "FASM_PLUS OS Core" {
    multiboot2 /boot/kernel.bin
    boot
}
