# =============================================================================
# FASM_PLUS T440 — GRUB2 configuration
# Boots the Multiboot2 kernel with a VESA linear-framebuffer graphics mode.
#
# The kernel is a Multiboot2 ELF image. GRUB2's `multiboot2` command loads it
# and, because the kernel's Multiboot2 header carries a framebuffer request
# tag, GRUB2 sets a graphics mode and passes the framebuffer address to the
# kernel in the boot-information structure.
#
# This config is built for the physical ThinkPad T440 handoff: it loads every
# video module GRUB2 needs, tries several resolutions in order of preference,
# and keeps the framebuffer alive through the kernel handoff.
# =============================================================================

# --- Load the video modules ---------------------------------------------------
# all_video pulls in every video driver GRUB2 has; vbe is the VESA BIOS
# Extensions driver (the one that sets the linear framebuffer); gfxterm is the
# graphics terminal; gfxpayload keeps the mode set for the payload (the kernel).
insmod all_video
insmod vbe
insmod gfxterm
insmod gfxpayload

# --- Graphics mode with fallback ---------------------------------------------
# GRUB2 tries each mode left to right and uses the first one the firmware
# supports. The T440 panel is natively 1600x900, but some panels do not expose
# 1600x900 through VESA; 1024x768x32 is the safest, most universal VESA mode.
#
# Order: native panel first, then common widescreen, then the safe fallbacks.
set gfxmode=1600x900x32,1366x768x32,1024x768x32,800x600x32,640x480x32

# Keep GRUB's own console in TEXT mode so it does not hold the graphics device
# in a way that interferes with the kernel's framebuffer handoff. The kernel
# re-initializes graphics from the framebuffer tag, so GRUB's terminal mode
# does not need to be graphical.
terminal_output console

# --- Boot the kernel automatically -------------------------------------------
set timeout=5
set default=0

menuentry "FASM_PLUS OS Core (T440)" {
    # Keep the graphics mode GRUB2 set through the kernel handoff. Without
    # `keep`, GRUB2 may restore text mode before jumping to the kernel, which
    # blanks the framebuffer the kernel is about to draw into.
    set gfxpayload=keep
    multiboot2 /boot/kernel.bin
    boot
}
